<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astrocyte — explore the habitat</title>
  <link rel="stylesheet" href="map.css">
</head>
<body>
<main class="map-shell">
  <header class="map-header">
    <div>
      <span class="eyebrow">YOUR OUTPOST · TASK LOCATIONS</span>
      <h2>Mars outpost habitat map</h2>
    </div>
    <div class="map-header-actions"><span id="task-count" class="task-count"></span><span class="map-instructions" id="map-instructions">Hover to explore</span></div>
  </header>

  <div class="map-layout">
    <div class="scene">
      <div id="task-markers" aria-label="Assigned habitat tasks"></div>
      <!-- Original SVG scene. Each data-area matches HABITAT_AREAS in models/areas.py. -->
      <svg class="habitat-scene" viewBox="0 0 1240 790" role="group" aria-labelledby="map-title map-description" xmlns="http://www.w3.org/2000/svg">
        <title id="map-title">Explore the seven spaces of the Mars outpost</title>
        <desc id="map-description">An isometric habitat with living quarters, life support tanks, laboratories and workshops, an exercise module, solar panels and batteries, a greenhouse and a separate lander pad. Tab to a building, then press Enter or Space to open it.</desc>
        <defs>
          <linearGradient id="terrain" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#d19675"/><stop offset=".5" stop-color="#bd7d5d"/><stop offset="1" stop-color="#9c5b45"/></linearGradient>
          <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5e8d0"/><stop offset="1" stop-color="#d8c4a3"/></linearGradient>
          <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c6dfb7" stop-opacity=".88"/><stop offset=".5" stop-color="#80ab93" stop-opacity=".8"/><stop offset="1" stop-color="#466e62" stop-opacity=".92"/></linearGradient>
          <linearGradient id="solar" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#617d9c"/><stop offset="1" stop-color="#304d68"/></linearGradient>
          <linearGradient id="tank" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#93aba5"/><stop offset=".5" stop-color="#d4ded0"/><stop offset="1" stop-color="#7e9892"/></linearGradient>

          <filter id="structure-shadow" x="-25%" y="-25%" width="160%" height="170%"><feDropShadow dx="9" dy="13" stdDeviation="4" flood-color="#452f28" flood-opacity=".26"/></filter>
          <symbol id="cabin" viewBox="0 0 200 170">
            <path d="m10 65 98-51 83 45-98 53Z" fill="url(#roof)" stroke="#c6b493" stroke-width="1.2"/>
            <path d="m10 65 83 47v43L10 108Z" fill="#d5c0a1"/>
            <path d="m93 112 98-53v43l-98 53Z" fill="#a89277"/>
            <path d="m24 62 84-37 68 35-83 44Z" fill="#f4e6cb"/>

          <g class="label" transform="translate(63 219)"><text class="label-code" x="-11" y="0"/><text class="label-name" x="9" y="0"/></g>

      <div class="scene-key"><span><i class="key-tunnel"></i>Habitat links</span><span><i class="key-service"></i>Surface access</span><span><i class="key-power"></i>Power conduit</span><span class="schematic-note">Concept schematic · Not to scale</span></div>
