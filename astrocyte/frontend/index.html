<!doctype html>

<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#f4efe7;background:#141b22}.shell{border:1px solid #354047;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 45% 48%,#49362d 0%,#22272b 60%,#151d25 100%)}.top{display:flex;justify-content:space-between;padding:20px 24px;font-size:11px;letter-spacing:2px;color:#aeb9b9}.live{color:#9edbc2}.layout{display:grid;grid-template-columns:1fr 240px;align-items:center}.scene{min-width:0}svg{width:100%;height:auto;display:block}.zone{cursor:pointer;outline:none}.zone .floor{stroke:#c69772;stroke-width:1;transition:all .2s}.zone:hover .floor,.zone:focus .floor,.zone.selected .floor{stroke:#ffd6a8;stroke-width:3;filter:drop-shadow(0 0 10px #f6b17c)}.zone:hover .structure,.zone:focus .structure{filter:brightness(1.18)}.label{font-size:12px;fill:#e7e3d9;font-weight:600;letter-spacing:1px;paint-order:stroke;stroke:#292727;stroke-width:4}.num{font-size:10px;fill:#eab38e}.corridor{fill:none;stroke:#a5a69d;stroke-width:12;stroke-linejoin:round;opacity:.5}.road{fill:none;stroke:#b59479;stroke-dasharray:4 8;stroke-width:1;opacity:.4}.panel{padding:22px;margin:0 22px 20px 0;border:1px solid #64706d66;background:#111b21e8;border-radius:12px;min-height:255px}.tag{font-size:10px;letter-spacing:2px;color:#e9ab7f}.panel h2{font-size:23px;font-weight:500;margin:16px 0 10px}.panel p{font-size:13px;line-height:1.65;color:#b6c3c5}.panel .task{border-top:1px solid #384549;padding-top:14px;color:#e3e7e2}button{font:inherit;cursor:pointer;color:#142029;background:#eab28b;border:0;border-radius:7px;padding:12px 14px;width:100%;font-size:12px;font-weight:700}button:focus-visible{outline:3px solid white;outline-offset:3px}.foot{padding:0 24px 18px;color:#9ba9ac;font-size:11px;display:flex;justify-content:space-between}.badge{fill:#e3ae87}.small{font-size:10px;fill:#c3b9ab}@media(max-width:650px){.layout{grid-template-columns:1fr}.panel{margin:0 16px 18px;min-height:0}.panel h2{margin:8px 0}.top{font-size:9px;padding:16px}.foot{font-size:10px}.panel p{margin:8px 0}}
</style></head><body>

</svg></div><aside class="panel" aria-live="polite"><div class="tag" id="sector">SECTOR 01 / RECOVERY</div><h2 id="title">Sleeping quarters</h2><p id="description">Review overnight heart rate, HRV and sleep duration.</p><p class="task" id="task">Today's task: review your recovery readings.</p><button id="open">Open sleep dashboard ↗</button></aside></div><div class="foot"><span>Hover to explore · Click to enter</span><span>Keyboard & touch enabled</span></div></div>
<script>
const zones={sleep:['01 / RECOVERY','Sleeping quarters','Review overnight heart rate, HRV and sleep duration.','Review your recovery readings.','sleep'],medical:['02 / HEALTH','Medical bay','Review oxygen saturation and temperature. Record symptoms in your daily check-in.','Complete your daily health check.','health'],exercise:['03 / MOVEMENT','Exercise area','Explore activity minutes and recorded heart-rate trends.','Review your activity session.','activity'],nutrition:['04 / NUTRITION','Kitchen','Review daily fluid and energy intake.','Review your nutrition and hydration log.','nutrition'],wellbeing:['05 / WELLBEING','Greenhouse','Reflect on your mood and stress in a quiet corner of the base.','Complete a wellbeing check-in.','wellbeing'],eva:['06 / EXPLORATION','Airlock','Review recorded EVA duration and radiation exposure.','Complete the pre-EVA checklist.','EVA']};
let selected='sleep';
function select(id){selected=id;const z=zones[id];document.getElementById('sector').textContent='SECTOR '+z[0];document.getElementById('title').textContent=z[1];document.getElementById('description').textContent=z[2];document.getElementById('task').textContent="Today's task: "+z[3];document.getElementById('open').textContent='Open '+z[4]+' dashboard ↗';document.querySelectorAll('.zone').forEach(el=>el.classList.toggle('selected',el.dataset.zone===id));}
function send(type,data={}){window.parent.postMessage({isStreamlitMessage:true,type,...data},'*');}
function openZone(id){select(id);send('streamlit:setComponentValue',{value:{zone:id,event:Date.now()},dataType:'json'});}
document.querySelectorAll('.zone').forEach(el=>{el.addEventListener('mouseenter',()=>select(el.dataset.zone));el.addEventListener('focus',()=>select(el.dataset.zone));el.addEventListener('click',()=>openZone(el.dataset.zone));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openZone(el.dataset.zone)}})});
document.getElementById('open').onclick=()=>openZone(selected);
function resize(){send('streamlit:setFrameHeight',{height:document.documentElement.scrollHeight})}
window.addEventListener('message',e=>{if(e.source!==window.parent)return;if(e.data.type==='streamlit:render')resize()});
new ResizeObserver(resize).observe(document.querySelector('.shell'));
select('sleep');send('streamlit:componentReady',{apiVersion:1});resize();
</script></body></html>
